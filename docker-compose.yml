version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: guardian_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: guardian
      MONGO_INITDB_ROOT_PASSWORD: guardian_secret
      MONGO_INITDB_DATABASE: guardian_db
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: guardian_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://guardian:guardian_secret@mongodb:27017/guardian_db?authSource=admin
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - JWT_SECRET=${JWT_SECRET:-supersecret_change_in_production}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: guardian_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
